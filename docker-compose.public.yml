# Optional public deployment. DNS A/AAAA must point to this server; ports 80/443 open.
# CAUTION: public API without authentication can be abused. Prefer VPN/private access.
services:
  downloader:
    build: .
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - downloader
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
